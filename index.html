<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AJSF Online Login</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="shell"><header class="brand"><div class="mark">AJSF</div><div><h1>ARK JAN SAMRIDDHI FOUNDATION</h1><p>SAPNE AAPKE SATH HAMARA</p></div></header>
<section class="card" id="loginCard"><span class="eyebrow">SECURE STAFF ACCESS</span><h2>लॉगिन करें</h2><p class="muted">Admin और अधिकृत Collector के लिए</p>
<form id="loginForm"><label for="email">ईमेल</label><input id="email" type="email" autocomplete="username" placeholder="अपना ईमेल लिखें" required><label for="password">पासवर्ड</label><input id="password" type="password" autocomplete="current-password" placeholder="पासवर्ड लिखें" required><button id="loginBtn" type="submit">लॉगिन करें</button></form><p id="message" class="message" role="status"></p><p class="small">अपना पासवर्ड किसी के साथ साझा न करें।</p></section>
<section class="card hidden" id="dashboardCard"><span class="eyebrow">LOGIN SUCCESSFUL</span><h2>स्वागत है, <span id="staffName">Staff</span></h2><div class="info"><span>Staff ID</span><strong id="staffCode">—</strong></div><div class="info"><span>Role</span><strong id="staffRole">—</strong></div><p class="muted" id="nextStep"></p><button class="secondary" id="logoutBtn">लॉगआउट</button></section><footer>AJSF ONLINE · सुरक्षित Collection Management</footer></main><script type="module" src="./src/app.js"></script></body></html>
