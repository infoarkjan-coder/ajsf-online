name: Publish AJSF APK to website

on:
  push:
    branches:
      - release/receipt-whatsapp-only
    paths:
      - ".github/workflows/publish-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: release/receipt-whatsapp-only
          fetch-depth: 0

      - name: Find latest successful Android APK build
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/infoarkjan-coder/ajsf-online"
          RUNS="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/actions/workflows/android-apk.yml/runs?branch=android-apk%2Finitial-wrapper&status=success&per_page=20")"
          ARTIFACT_ID=""
          while IFS= read -r RUN_ID; do
            [ -n "$RUN_ID" ] || continue
            CANDIDATE="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API/actions/runs/$RUN_ID/artifacts" \
              | jq -r '.artifacts[] | select(.name=="AJSF-Online-Android-APK" and .expired==false) | .id' | head -n 1)"
            if [ -n "$CANDIDATE" ]; then
              ARTIFACT_ID="$CANDIDATE"
              echo "Using APK artifact $ARTIFACT_ID from successful build $RUN_ID"
              break
            fi
          done < <(printf '%s' "$RUNS" | jq -r '.workflow_runs[].id')
          test -n "$ARTIFACT_ID" || { echo "No unexpired APK artifact found in the latest 20 successful Android builds."; exit 1; }
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Download latest APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ajs-apk
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/infoarkjan-coder/ajsf-online/actions/artifacts/$ARTIFACT_ID/zip" \
            -o /tmp/ajs-apk/artifact.zip
          unzip -o /tmp/ajs-apk/artifact.zip -d /tmp/ajs-apk/unpacked
          APK_PATH="$(find /tmp/ajs-apk/unpacked -type f -name '*.apk' -print -quit)"
          test -n "$APK_PATH"
          cp "$APK_PATH" ./AJSF-Online.apk
          test -s ./AJSF-Online.apk

      - name: Add permanent website download link
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()
          marker = '<section class="card" id="loginCard">'
          block = '''<section class="card app-download-card" aria-label="Android app download">
          <h2> AJSF Android App </h2>
          <p class="muted">मोबाइल में AJSF Online इस्तेमाल करने के लिए Android App डाउनलोड करें।</p>
          <a class="app-download-link" href="./AJSF-Online.apk" download="AJSF-Online.apk">⬇ Download AJSF Android App (APK)</a>
          <p class="small muted">Android 8.0 या उससे ऊपर · APK install करते समय अनुमति माँगी जा सकती है।</p>
          </section>
          '''
          if 'id="appDownloadCard"' not in s:
              block = block.replace('class="card app-download-card"', 'class="card app-download-card" id="appDownloadCard"')
              if marker not in s:
                  raise SystemExit("Login section marker not found; refusing to edit page.")
              s = s.replace(marker, block + marker, 1)
              p.write_text(s)
          PY

      - name: Commit APK and download button
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AJSF-Online.apk index.html
          git commit -m "Host AJSF Android APK on website"
          git push origin HEAD:release/receipt-whatsapp-only
