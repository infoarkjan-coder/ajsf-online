name: JavaScript syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          cp src/app.js /tmp/app.mjs
          cp src/data-tools.js /tmp/data-tools.mjs
          node --check /tmp/app.mjs
          node --check /tmp/data-tools.mjs
